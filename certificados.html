<!DOCTYPE html>
<html lang="pt-br"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Certificados</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="particulas"></div>


  <main class="certificados">
    <header class="certificados-cabecalho">
      <h1>Meus Certificados</h1><p>
        Aqui apresento os certificados que representam
        minha trajetória no curso.
        
      </p>
    </header>

    <section class="certificados-lista"
        aria-label="Lista de certificados">

      <article class="certificado-card">

        <div class="certificado-conteudo">
            <img src="./img/certificado1.jpg" alt="Prévia do certificado" class="certificado-imagem">

          <span class="certificado-icone" aria-hidden="true">
              <img src="./img/icon.jpg" alt="Icone">
          </span>

          <h2>Aula Magna</h2>

          <p>
            Certificado de participação da Aula Magna Trilhas</p>

          <a
            href="https://drive.google.com/drive/folders/1fimgxfz2rtgBu4XA3AQQAZc2MA5AeiyE" class="certificado-visualizar" target="_blank" rel="noopener noreferrer">Visualizar<span aria-hidden="true">↗</span>
            
          </a>
        </div>
      </article>

    </section>
    <div class="voltar-container">

      <a href="./index.html" class="botao-voltar">
        <span class="seta-voltar">&larr;</span> Voltar para o início</a>

    </div>
  </main>
</body>
</html>
